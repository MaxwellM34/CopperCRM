<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copper</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;
        color: #111;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      #status {
        font-size: 14px;
      }
      #profile {
        margin-top: 12px;
      }
      #profile-message {
        font-size: 13px;
        color: #444;
      }
      #profile-card {
        display: none;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .profile-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #eee;
        object-fit: cover;
        flex: none;
      }
      .profile-name {
        font-size: 16px;
        font-weight: 600;
      }
      .profile-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .profile-subtitle {
        font-size: 13px;
        color: #444;
      }
      .add-button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #2f2f2f;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .divider {
        margin: 14px 0;
        border-top: 1px solid #e6e6e6;
      }
      .detail-section {
        margin-bottom: 12px;
      }
      .profile-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .detail-label {
        font-size: 12px;
        font-weight: 600;
        color: #444;
      }
      .field-input {
        font-size: 14px;
        padding: 8px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
      }
      .field-input:focus {
        outline: none;
        border-color: #888;
      }
      .button-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .detail-value {
        font-size: 14px;
        margin-top: 4px;
        color: #111;
      }
      .detail-link {
        color: #0a66c2;
        word-break: break-all;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Copper</h1>
    <div id="status">Signing in...</div>
    <div id="profile">
      <div id="profile-message"></div>
      <div id="profile-card">
        <div class="profile-header">
          <img id="profile-avatar" class="profile-avatar" alt="" />
          <div class="profile-text">
            <div id="profile-name" class="profile-name"></div>
            <div id="profile-subtitle" class="profile-subtitle"></div>
          </div>
        </div>
        <div id="profile-form" class="profile-form">
          <label class="field">
            <span class="detail-label">Name</span>
            <input id="field-name" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Job Title</span>
            <input id="field-job-title" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Company</span>
            <input id="field-company" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">LinkedIn</span>
            <input id="field-linkedin" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Profile Photo URL</span>
            <input id="field-avatar" class="field-input" type="text" />
          </label>
        </div>
        <div class="divider"></div>
        <div class="button-row">
          <button id="add-button" class="add-button" type="button">Add To Copper</button>
          <button id="update-button" class="add-button" type="button">Update in Copper</button>
        </div>
      </div>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
