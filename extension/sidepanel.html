<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copper</title>
    <style>
      :root {
        color: #111;
        font-family: "Inter", "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f6f6f6;
        min-height: 100vh;
      }
      .panel-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .panel-header h1 {
        font-size: 20px;
        margin: 0;
        color: #111;
        font-weight: 600;
      }
      .logo {
        width: 32px;
        height: 32px;
      }
      .home-view {
        font-family: "Cormorant Garamond", "Georgia", serif;
      }
      .home-card {
        background: #fff;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .home-label {
        font-size: 16px;
        color: #444;
      }
      .home-value {
        font-size: 18px;
        font-weight: 700;
        color: #999;
      }
      .profile-view {
        display: none;
        position: relative;
      }
      #status {
        font-size: 14px;
        margin-bottom: 6px;
        color: #666;
      }
      #profile-card {
        display: none;
        background: #fff;
        border-radius: 20px;
        padding: 18px;
        border: 1px solid rgba(0, 0, 0, 0.07);
        box-shadow: 0 10px 40px rgba(11, 22, 41, 0.08);
        position: relative;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .profile-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #eee;
        object-fit: cover;
        flex: none;
      }
      .profile-name {
        font-size: 16px;
        font-weight: 600;
      }
      .profile-subtitle {
        font-size: 13px;
        color: #444;
      }
      .add-button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #1f1f1f;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .divider {
        margin: 14px 0;
        border-top: 1px solid #e6e6e6;
      }
      .profile-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field-input {
        font-size: 14px;
        padding: 8px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
      }
      .field-input:focus {
        outline: none;
        border-color: #888;
      }
      .button-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .loading-overlay {
        position: absolute;
        inset: 8px;
        background: radial-gradient(circle at 20% 20%, rgba(255, 102, 0, 0.25), rgba(255, 255, 255, 0)),
          linear-gradient(135deg, #1c1c1c, #3b3b3b);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 10;
        color: #fff;
        overflow: hidden;
        gap: 12px;
      }
      .loading-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .cat-wrapper {
        position: relative;
        width: 64px;
        height: 64px;
      }
      .cat {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff9500, #ff4500);
        animation: cat-walk 1.6s ease-in-out infinite alternate;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }
      .cat::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.7);
        animation: cat-spin 1.6s linear infinite;
      }
      .cat-tail {
        position: absolute;
        width: 36px;
        height: 6px;
        background: linear-gradient(135deg, #ff4500, #ff9500);
        border-radius: 999px;
        bottom: 6px;
        right: -8px;
        transform-origin: left center;
        animation: tail-swing 1.2s ease-in-out infinite alternate;
      }
      .loading-text {
        font-size: 18px;
        letter-spacing: 0.12em;
      }
      .loading-text .dots {
        animation: dots 1.2s steps(3) infinite;
      }
      .liquid {
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, rgba(255, 102, 0, 0.3), rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.2));
        animation: liquid 4s ease-in-out infinite;
        mix-blend-mode: screen;
        opacity: 0.6;
      }
      @keyframes cat-walk {
        from {
          transform: translateX(-6px);
        }
        to {
          transform: translateX(6px) scale(1.05);
        }
      }
      @keyframes cat-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes tail-swing {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(20deg);
        }
      }
      @keyframes dots {
        0% {
          content: "";
        }
        33% {
          content: ".";
        }
        66% {
          content: "..";
        }
        100% {
          content: "...";
        }
      }
      @keyframes liquid {
        0% {
          transform: translateX(-20%) skewX(5deg);
        }
        50% {
          transform: translateX(20%) skewX(-3deg);
        }
        100% {
          transform: translateX(-20%) skewX(5deg);
        }
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="panel-header">
      <img src="copper.png" class="logo" alt="Copper" />
      <h1>Copper CRM</h1>
    </header>
    <div id="home" class="home-view">
      <div class="home-card">
        <div class="home-row">
          <div class="home-label">Email Reminders</div>
          <div class="home-value">No Email Reminders</div>
        </div>
        <div class="home-row">
          <div class="home-label">Upcoming Tasks</div>
          <div class="home-value">No Tasks</div>
        </div>
      </div>
    </div>
    <div id="profile" class="profile-view">
      <div id="loading" class="loading-overlay hidden">
        <div class="loading-content">
          <div class="cat-wrapper">
            <div class="cat"></div>
            <div class="cat-tail"></div>
          </div>
          <div class="loading-text">
            <span>Loading</span>
            <span class="dots">...</span>
          </div>
        </div>
        <div class="liquid"></div>
      </div>
      <div id="status">Signing in...</div>
      <div id="profile-message"></div>
      <div id="profile-card">
        <div class="profile-header">
          <img id="profile-avatar" class="profile-avatar" alt="" />
          <div class="profile-text">
            <div id="profile-name" class="profile-name"></div>
            <div id="profile-subtitle" class="profile-subtitle"></div>
          </div>
        </div>
        <div id="profile-form" class="profile-form">
          <label class="field">
            <span class="detail-label">Name</span>
            <input id="field-name" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Job Title</span>
            <input id="field-job-title" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Company</span>
            <input id="field-company" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">LinkedIn</span>
            <input id="field-linkedin" class="field-input" type="text" />
          </label>
          <label class="field">
            <span class="detail-label">Profile Photo URL</span>
            <input id="field-avatar" class="field-input" type="text" />
          </label>
        </div>
        <div class="divider"></div>
        <div class="button-row">
          <button id="add-button" class="add-button" type="button">Add To Copper</button>
          <button id="update-button" class="add-button" type="button">Update in Copper</button>
        </div>
      </div>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
