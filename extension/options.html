<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copper CRM Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel__header">
        <h1>Extension Settings</h1>
      </header>
      <section class="card">
        <label>
          API Base URL
          <input id="api-base-url" type="text" placeholder="http://localhost:8000" />
        </label>
        <label>
          Google OAuth Client ID
          <input id="google-client-id" type="text" placeholder="your-client-id.apps.googleusercontent.com" />
        </label>
        <button id="save-settings" class="primary">Save</button>
        <p id="save-status" class="status"></p>
      </section>
    </div>
    <script src="options.js"></script>
  </body>
</html>
